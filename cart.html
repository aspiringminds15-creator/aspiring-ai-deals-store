<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review your Aspiring AI Deals shopping cart." /><title>Your Cart | Aspiring AI Deals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">A</span>ASPIRING AI DEALS</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Products</a></nav><a class="cart-button" href="cart.html" aria-current="page">Cart <span id="cart-count" aria-live="polite">0</span></a></header>
    <main class="cart-page"><section class="cart-layout" aria-labelledby="cart-title"><div class="cart-main"><p class="eyebrow">YOUR SELECTION</p><h1 id="cart-title">Your cart</h1><div id="cart-items" class="cart-items"></div></div>
      <aside class="order-summary" id="checkout-area"><p class="eyebrow">ORDER SUMMARY</p><h2>Ready to check out?</h2><div class="summary-row"><span>Total</span><strong id="cart-total">$0.00</strong></div><form id="checkout-form" class="checkout-form"><label>Full name<input required name="name" autocomplete="name" placeholder="Your full name" /></label><label>Email address<input required type="email" name="email" autocomplete="email" placeholder="you@example.com" /></label><fieldset class="payment-options"><legend>Payment method</legend><label class="payment-option"><input type="radio" name="payment-method" value="paypal" checked /><span class="payment-option-copy"><strong>PayPal</strong><small>Pay with your PayPal account</small></span><span class="payment-mark paypal-mark">P</span></label><label class="payment-option"><input type="radio" name="payment-method" value="card" /><span class="payment-option-copy"><strong>Credit / Debit Card</strong><small>Visa, Mastercard, and more</small></span><span class="payment-mark card-mark">▣</span></label></fieldset><button class="hero-button" type="submit">Continue to payment <span>→</span></button></form><p class="checkout-note">Demo only — payment choices are displayed for preview. No payment details are collected.</p><p id="checkout-message" class="checkout-message" role="status"></p></aside>
    </section></main>
    <footer>© 2026 Aspiring AI Deals · Build with more clarity.</footer><script src="script.js"></script>
  </body>
</html>
